<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jison-lex Browser Example</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>jison-lex Browser Example</h1>
    
    <div class="input-section">
        <label for="input">Enter input to tokenize:</label>
        <input 
            type="text" 
            id="input" 
            placeholder='e.g., 2 - /* comment */ 3'
            value="2 - /* comment */ 3"
        >
        <button onclick="tokenize()">Tokenize</button>
    </div>

    <div id="results"></div>

    <!-- Include the generated lexer (compiled with -t js) -->
    <script src="./example-browser.js"></script>
    
    <script src="./app.js"></script>
</body>
</html>
